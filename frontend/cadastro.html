<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="css/cadastro.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
    <body>
        <main class="login-container">
            <section class="login-imagem">
                <img src="/frontend/assets/imagens/Group 463.png" alt="">
            </section>
            
            <section class="login-formulario">
                <h1 id="titulo">Cadastro</h1>
                <form id="form-login">
                    <input type="text" id="nome" placeholder="Nome" required>
                    <input type="text" id="sobrenome" placeholder="Sobrenome" required>
                    <input type="email" id="email" placeholder="E-mail" required>
                    <input type="text" id="empresa" placeholder="Empresa" required>
                    <input type="password" id="senha" placeholder="Senha" required>
                    <input type="password" id="confirmar" placeholder="Confirme a senha" required>
                    <div class="opcoes-login">
                        <label id="termos">
                            <input type="checkbox">
                            Concordo com os Termos de Serviço e a politica de Privacidade
                        </label>
                    </div>
                    <input type="submit" id="criar-conta" placeholder="Criar Conta">
                </form>
                <p>Já tem uma conta? <a href="">Entrar</a></p>

            </section>

        </main>
    </body>
</html>
